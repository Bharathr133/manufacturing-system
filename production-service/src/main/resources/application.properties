spring.application.name=production-service
server.port=${PORT:8083}

#spring.datasource.url=jdbc:postgresql://localhost:5432/production_db
#spring.datasource.username=postgres
#spring.datasource.password=Bharath

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://production-db:5432/production_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${RAILWAY_PRIVATE_DOMAIN:production-service}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${PORT:8083}
eureka.instance.instance-id=${spring.application.name}:${random.value}
# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.machineService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.machineService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.machineService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.machineService.sliding-window-size=10
resilience4j.circuitbreaker.instances.machineService.minimum-number-of-calls=5

# Actuator endpoints to monitor circuit breaker
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always

spring.application.name=production-service
server.port=8083

#spring.datasource.url=jdbc:postgresql://localhost:5432/production_db
#spring.datasource.username=postgres
#spring.datasource.password=Bharath

spring.datasource.url=jdbc:postgresql://production-db:5432/production_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.machineService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.machineService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.machineService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.machineService.sliding-window-size=10
resilience4j.circuitbreaker.instances.machineService.minimum-number-of-calls=5

# Actuator endpoints to monitor circuit breaker
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always

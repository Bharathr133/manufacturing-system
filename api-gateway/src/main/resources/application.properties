spring.application.name=api-gateway
server.port=${PORT:8080}

# Eureka Configuration
eureka.client.service-url.defaultZone=https://eureka-serverr.up.railway.app/eureka
eureka.instance.hostname=${RAILWAY_PRIVATE_DOMAIN:api-gateway}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${PORT:8080}
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Machine Service - Route 0
spring.cloud.gateway.server.webmvc.routes[0].id=machine-service
spring.cloud.gateway.server.webmvc.routes[0].uri=https://machine-service.onrender.com
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/machines/**

# Production Service - Route 1
spring.cloud.gateway.server.webmvc.routes[1].id=production-service
spring.cloud.gateway.server.webmvc.routes[1].uri=https://production-service.onrender.com
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/production/**

# Quality Service - Route 2
spring.cloud.gateway.server.webmvc.routes[2].id=quality-service
spring.cloud.gateway.server.webmvc.routes[2].uri=https://quality-service.onrender.com
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/quality/**
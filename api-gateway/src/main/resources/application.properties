spring.application.name=api-gateway
server.port=${PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${RAILWAY_PRIVATE_DOMAIN:api-gateway}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${PORT:8080}
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Machine Service
spring.cloud.gateway.server.webmvc.routes[0].id=machine-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${MACHINE_SERVICE_URL:https://machine-service.up.railway.app}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/machines/**

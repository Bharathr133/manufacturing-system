# Service Configuration
spring.application.name=quality-service
server.port=8084

# Database Configuration
#spring.datasource.url=jdbc:postgresql://localhost:5432/quality_db
#spring.datasource.username=postgres
#spring.datasource.password=Bharath

spring.datasource.url=jdbc:postgresql://quality-db:5432/quality_db
spring.datasource.username=postgres
spring.datasource.password=password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.service-url.defaultZone=http://eureka-server.railway.internal:8761/eureka
eureka.instance.prefer-ip-address=true


# Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
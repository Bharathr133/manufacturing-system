#for docker

spring.application.name=machine-service
server.port=8081

# Database - Use Docker service name, NOT localhost!
#spring.datasource.url=jdbc:postgresql://machine-db:5432/machine_db
#spring.datasource.username=postgres
#spring.datasource.password=password
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
#eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.service-url.defaultZone=http://eureka-server.railway.internal:8761/eureka
eureka.instance.prefer-ip-address=true

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
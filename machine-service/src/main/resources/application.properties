#for docker

spring.application.name=machine-service
server.port=${PORT:8081}

# Database - Use Docker service name, NOT localhost!
#spring.datasource.url=jdbc:postgresql://machine-db:5432/machine_db
#spring.datasource.username=postgres
#spring.datasource.password=password
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://machine-db:5432/machine_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${RAILWAY_PRIVATE_DOMAIN:machine-service}
eureka.instance.prefer-ip-address=false
eureka.instance.non-secure-port=${PORT:8081}
eureka.instance.instance-id=${spring.application.name}:${random.value}
# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
